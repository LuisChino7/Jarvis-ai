<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINO AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050b14;
      color: white;
      text-align: center;
    }

    header {
      padding: 30px 20px 15px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
    }

    .subtitle {
      color: #8ea5b8;
      margin-top: 8px;
    }

    .chat {
      width: 90%;
      max-width: 700px;
      height: 400px;
      margin: 25px auto;
      background: #0b1420;
      border: 1px solid #17354d;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      text-align: left;
    }

    .message {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    .CHINO {
      background: #102638;
      border-left: 3px solid #00d9ff;
    }

    .user {
      background: #17351f;
      margin-left: auto;
      border-right: 3px solid #00ff88;
    }

    .input-area {
      width: 90%;
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #24445c;
      background: #0b1420;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #00bcd4;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
    }

    .modules {
      margin: 30px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .module {
      background: #101d2b;
      border: 1px solid #1d4058;
    }
  </style>
</head>

<body>

  <header>
    <h1>CHINO AI</h1>
    <p class="subtitle">Asistente central de IA personal</p>
  </header>

  <div class="chat" id="chat">
    <div class="message jarvis">
      🤖 <strong>CHINO:</strong> Sistema iniciado. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Escribe un mensaje..."
      onkeydown="if(event.key === 'Enter') enviarMensaje()"
    >

    <button onclick="enviarMensaje()">Enviar</button>
  </div>

  <div class="modules">
    <button class="module" onclick="modulo('Biblia')">📖 Biblia</button>
    <button class="module" onclick="modulo('Música')">🎵 Música</button>
    <button class="module" onclick="modulo('Podcast')">🎙️ Podcast</button>
    <button class="module" onclick="modulo('Asistente')">🧠 Asistente</button>
  </div>

  <script>

/* =====================================================
   CHINO AI 3.0
   CEREBRO CENTRAL - ROUTER DE INTENCIONES
   ===================================================== */


/* =====================================================
   CONFIGURACIÓN PRINCIPAL
   ===================================================== */

const CHINO = {

    nombre: "CHINO",

    version: "3.0",

    personalidad: "cercana",

    moduloActual: "Asistente",

    estado: "activo"

};


/* =====================================================
   UTILIDADES
   ===================================================== */

function limpiarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


function escaparHTML(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;

}


/* =====================================================
   CEREBRO CENTRAL
   ===================================================== */

function analizarIntencion(mensaje) {

    const texto = limpiarTexto(mensaje);


    /* -------------------------
       SALUDOS
       ------------------------- */

    const saludos = [
        "hola",
        "hey",
        "buenas",
        "buenos dias",
        "buenas tardes",
        "buenas noches",
        "que onda",
        "que tal"
    ];

    if (
        saludos.some(palabra =>
            texto === palabra ||
            texto.startsWith(palabra + " ")
        )
    ) {

        return {
            modulo: "Asistente",
            intencion: "saludo",
            confianza: 1
        };

    }


    /* -------------------------
       BIBLIA
       ------------------------- */

    const palabrasBiblia = [

        "biblia",
        "versiculo",
        "versiculos",
        "pasaje",
        "pasajes",
        "predica",
        "predicar",
        "predicacion",
        "sermon",
        "sermones",
        "estudio biblico",
        "estudio de biblia",
        "capitulo",
        "versiculo",
        "evangelio",
        "jesus",
        "dios",
        "apostol",
        "apostoles",
        "oracion",
        "orar",
        "devocional",
        "devocionales",
        "texto biblico",
        "ensenanza biblica",
        "ensenanza cristiana"
    ];

    if (
        palabrasBiblia.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {
            modulo: "Biblia",
            intencion: "biblia",
            confianza: 0.95
        };

    }


    /* -------------------------
       MÚSICA
       ------------------------- */

    const palabrasMusica = [

        "musica",
        "cancion",
        "canciones",
        "acorde",
        "acordes",
        "guitarra",
        "teclado",
        "piano",
        "bateria",
        "bajo",
        "instrumento",
        "instrumentos",
        "escala",
        "escalas",
        "ritmo",
        "ritmos",
        "tonalidad",
        "tonalidades",
        "transpose",
        "transponer",
        "adoracion",
        "alabanza",
        "worship",
        "ensayo",
        "musico",
        "musicos"
    ];

    if (
        palabrasMusica.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {
            modulo: "Música",
            intencion: "musica",
            confianza: 0.95
        };

    }


    /* -------------------------
       PODCAST
       ------------------------- */

    const palabrasPodcast = [

        "podcast",
        "episodio",
        "episodios",
        "guion",
        "guiones",
        "entrevista",
        "entrevistas",
        "preguntas para podcast",
        "tema para podcast",
        "temas para podcast",
        "invitado",
        "invitados",
        "grabacion",
        "contenido para podcast",
        "nombre para podcast"
    ];

    if (
        palabrasPodcast.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {
            modulo: "Podcast",
            intencion: "podcast",
            confianza: 0.95
        };

    }


    /* -------------------------
       ASISTENTE
       ------------------------- */

    const palabrasAsistente = [

        "ayudame",
        "ayuda",
        "puedes ayudarme",
        "que puedes hacer",
        "que sabes hacer",
        "quien eres",
        "quien es chino",
        "chino",
        "organiza",
        "organizar",
        "recordatorio",
        "recuerdame",
        "tarea",
        "tareas",
        "plan",
        "planes",
        "idea",
        "ideas"
    ];

    if (
        palabrasAsistente.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {
            modulo: "Asistente",
            intencion: "asistente",
            confianza: 0.85
        };

    }


    /* -------------------------
       DESCONOCIDO
       ------------------------- */

    return {

        modulo: "Asistente",
        intencion: "general",
        confianza: 0.30

    };

}


/* =====================================================
   RESPUESTAS DEL CEREBRO
   ===================================================== */

function generarRespuesta(mensaje, analisis) {

    const modulo = analisis.modulo;

    const intencion = analisis.intencion;


    /* -------------------------
       SALUDO
       ------------------------- */

    if (intencion === "saludo") {

        return "Hola bro. 😎 Soy CHINO AI 3.0. Mi cerebro central está activo. ¿Qué vamos a construir hoy?";

    }


    /* -------------------------
       BIBLIA
       ------------------------- */

    if (modulo === "Biblia") {

        CHINO.moduloActual = "Biblia";

        return `
        📖 <strong>Módulo Biblia activado.</strong><br><br>

        Entendí que tu solicitud está relacionada con la Biblia.
        Puedo ayudarte a trabajar en estudios bíblicos,
        prédicas, devocionales, versículos, personajes,
        temas y enseñanzas.
        `;

    }


    /* -------------------------
       MÚSICA
       ------------------------- */

    if (modulo === "Música") {

        CHINO.moduloActual = "Música";

        return `
        🎵 <strong>Módulo Música activado.</strong><br><br>

        Entendí que estás trabajando con música.
        Podemos desarrollar acordes, escalas,
        ejercicios, instrumentos, ritmos,
        alabanza y adoración.
        `;

    }


    /* -------------------------
       PODCAST
       ------------------------- */

    if (modulo === "Podcast") {

        CHINO.moduloActual = "Podcast";

        return `
        🎙️ <strong>Módulo Podcast activado.</strong><br><br>

        Entendí que estás trabajando en contenido
        para podcast. Podemos desarrollar temas,
        preguntas, guiones, episodios e ideas.
        `;

    }


    /* -------------------------
       ASISTENTE
       ------------------------- */

    if (modulo === "Asistente") {

        CHINO.moduloActual = "Asistente";


        if (intencion === "asistente") {

            return `
            🧠 <strong>Asistente central activado.</strong><br><br>

            Soy CHINO AI 3.0.
            Mi función es coordinar los diferentes módulos
            y ayudarte a decidir qué sistema debe encargarse
            de cada solicitud.
            `;

        }


        return `
        🤖 <strong>CHINO:</strong><br><br>

        Recibí tu mensaje, pero todavía no tengo suficiente
        información para dirigirlo a un módulo específico.

        Puedes pedirme algo relacionado con Biblia,
        Música, Podcast o Asistente.
        `;

    }


    return "Sistema central activo.";

}


/* =====================================================
   MOSTRAR MENSAJES
   ===================================================== */

function mostrarMensajeUsuario(mensaje) {

    const chat = document.getElementById("chat");

    const mensajeSeguro = escaparHTML(mensaje);

    chat.innerHTML += `

        <div class="message user">

            👤 <strong>Tú:</strong> ${mensajeSeguro}

        </div>

    `;

    chat.scrollTop = chat.scrollHeight;

}


function mostrarRespuesta(respuesta) {

    const chat = document.getElementById("chat");

    chat.innerHTML += `

        <div class="message jarvis">

            🤖 <strong>CHINO:</strong> ${respuesta}

        </div>

    `;

    chat.scrollTop = chat.scrollHeight;

}


/* =====================================================
   FUNCIÓN PRINCIPAL
   ===================================================== */

function enviarMensaje() {

    const input = document.getElementById("userInput");

    const mensaje = input.value.trim();


    if (mensaje === "") return;


    /* Mostrar mensaje */

    mostrarMensajeUsuario(mensaje);


    /* Limpiar entrada */

    input.value = "";


    /* Pensamiento del cerebro */

    setTimeout(() => {


        /* Analizar intención */

        const analisis = analizarIntencion(mensaje);


        console.log(
            "🧠 CHINO AI - Análisis:",
            analisis
        );


        /* Generar respuesta */

        const respuesta =
            generarRespuesta(
                mensaje,
                analisis
            );


        /* Mostrar respuesta */

        mostrarRespuesta(respuesta);


    }, 500);

}


/* =====================================================
   ACTIVACIÓN MANUAL DE MÓDULOS
   ===================================================== */

function modulo(nombre) {

    const chat = document.getElementById("chat");

    let respuesta = "";


    /* -------------------------
       BIBLIA
       ------------------------- */

    if (nombre === "Biblia") {

        CHINO.moduloActual = "Biblia";

        respuesta = `
        📖 <strong>Módulo Biblia activado.</strong><br><br>

        Estoy listo para ayudarte con estudios,
        versículos, prédicas y enseñanzas.
        `;

    }


    /* -------------------------
       MÚSICA
       ------------------------- */

    if (nombre === "Música") {

        CHINO.moduloActual = "Música";

        respuesta = `
        🎵 <strong>Módulo Música activado.</strong><br><br>

        Estoy listo para ayudarte con acordes,
        escalas, ejercicios, instrumentos,
        alabanza y adoración.
        `;

    }


    /* -------------------------
       PODCAST
       ------------------------- */

    if (nombre === "Podcast") {

        CHINO.moduloActual = "Podcast";

        respuesta = `
        🎙️ <strong>Módulo Podcast activado.</strong><br><br>

        Estoy listo para ayudarte con ideas,
        guiones, preguntas y contenido.
        `;

    }


    /* -------------------------
       ASISTENTE
       ------------------------- */

    if (nombre === "Asistente") {

        CHINO.moduloActual = "Asistente";

        respuesta = `
        🧠 <strong>Cerebro central activado.</strong><br><br>

        Soy el centro de CHINO AI.
        Estoy preparado para dirigir tus solicitudes
        al módulo correspondiente.
        `;

    }


    chat.innerHTML += `

        <div class="message jarvis">

            🤖 <strong>CHINO:</strong> ${respuesta}

        </div>

    `;


    chat.scrollTop = chat.scrollHeight;

}


/* =====================================================
   INICIALIZACIÓN
   ===================================================== */

console.log("=================================");
console.log("CHINO AI 3.0");
console.log("Cerebro central iniciado");
console.log("Estado:", CHINO.estado);
console.log("Módulo:", CHINO.moduloActual);
console.log("=================================");

  </script>

</body>
</html>
