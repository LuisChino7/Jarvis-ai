<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINO AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050b14;
      color: white;
      text-align: center;
    }

    header {
      padding: 30px 20px 15px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
    }

    .subtitle {
      color: #8ea5b8;
      margin-top: 8px;
    }

    .chat {
      width: 90%;
      max-width: 700px;
      height: 400px;
      margin: 25px auto;
      background: #0b1420;
      border: 1px solid #17354d;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      text-align: left;
    }

    .message {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    .CHINO {
      background: #102638;
      border-left: 3px solid #00d9ff;
    }

    .user {
      background: #17351f;
      margin-left: auto;
      border-right: 3px solid #00ff88;
    }

    .input-area {
      width: 90%;
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #24445c;
      background: #0b1420;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #00bcd4;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
    }

    .modules {
      margin: 30px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .module {
      background: #101d2b;
      border: 1px solid #1d4058;
    }
  </style>
</head>

<body>

  <header>
    <h1>CHINO AI</h1>
    <p class="subtitle">Asistente central de IA personal</p>
  </header>

  <div class="chat" id="chat">
    <div class="message jarvis">
      🤖 <strong>CHINO:</strong> Sistema iniciado. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Escribe un mensaje..."
      onkeydown="if(event.key === 'Enter') enviarMensaje()"
    >

    <button onclick="enviarMensaje()">Enviar</button>
  </div>

  <div class="modules">
    <button class="module" onclick="modulo('Biblia')">📖 Biblia</button>
    <button class="module" onclick="modulo('Música')">🎵 Música</button>
    <button class="module" onclick="modulo('Podcast')">🎙️ Podcast</button>
    <button class="module" onclick="modulo('Asistente')">🧠 Asistente</button>
  </div>

   <script>

/* =====================================================
   CHINO AI 3.0
   CEREBRO CENTRAL + MEMORIA V1
   ===================================================== */


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const CHINO = {

    nombre: "CHINO",

    version: "3.0",

    personalidad: "cercana",

    moduloActual: "Asistente",

    estado: "activo",

    contexto: {

        proyecto: null,

        tema: null,

        audiencia: null,

        detalles: []

    }

};


/* =====================================================
   MEMORIA DE CONVERSACIÓN
   ===================================================== */

let memoriaConversacion = [];


/*
   Guarda un mensaje en la memoria
*/

function guardarMemoria(rol, mensaje) {

    memoriaConversacion.push({

        rol: rol,

        mensaje: mensaje,

        fecha: new Date().toISOString()

    });


    /*
       Evitamos que la memoria crezca
       indefinidamente.
    */

    if (memoriaConversacion.length > 30) {

        memoriaConversacion.shift();

    }


    console.log(
        "🧠 Memoria actual:",
        memoriaConversacion
    );

}


/*
   Obtiene los últimos mensajes
*/

function obtenerMemoria() {

    return memoriaConversacion
        .slice(-10);

}


/*
   Limpia la memoria
*/

function limpiarMemoria() {

    memoriaConversacion = [];

    console.log(
        "🧠 Memoria de CHINO limpiada."
    );

}


/* =====================================================
   UTILIDADES
   ===================================================== */

function limpiarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


function escaparHTML(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;

}


/* =====================================================
   CEREBRO CENTRAL
   ===================================================== */
function analizarIntencion(mensaje) {
    const texto = limpiarTexto(mensaje);

    // =====================================
    // CONTINUACIONES DEL CONTEXTO ACTUAL
    // =====================================

    const esContinuacion =
        texto.startsWith("sobre ") ||
        texto.startsWith("acerca de ") ||
        texto.startsWith("para ") ||
        texto.includes("dame 3 puntos") ||
        texto.includes("3 puntos") ||
        texto.includes("tres puntos") ||
        texto.includes("hazme 3 puntos") ||
        texto.includes("quiero 3 puntos") ||
        texto.includes("agrega ") ||
        texto.includes("tambien ") ||
        texto.includes("ahora ") ||
        texto.includes("que sea ") ||
        texto.includes("dame ") ||
        texto.includes("hazlo ") ||
        texto.includes("desarrolla el punto") ||
        texto.includes("desarrollar el punto");
    if (
        esContinuacion &&
        CHINO.moduloActual !== "Asistente"
    ) {
        return {
            modulo: CHINO.moduloActual,
            intencion: "continuacion",
            confianza: 0.95
        };
    }

    // =====================================
    // BIBLIA
    // =====================================

    if (
        texto.includes("biblia") ||
        texto.includes("versiculo") ||
        texto.includes("versiculo") ||
        texto.includes("predica") ||
        texto.includes("predicar") ||
        texto.includes("sermon") ||
        texto.includes("estudio biblico") ||
        texto.includes("capitulo") ||
        texto.includes("evangelio") ||
        texto.includes("jesus") ||
        texto.includes("dios") ||
        texto.includes("oracion") ||
        texto.includes("devocional")
    ) {
        return {
            modulo: "Biblia",
            intencion: "biblia",
            confianza: 0.95
        };
    }

    // =====================================
    // MÚSICA
    // =====================================

    if (
        texto.includes("musica") ||
        texto.includes("cancion") ||
        texto.includes("acorde") ||
        texto.includes("guitarra") ||
        texto.includes("teclado") ||
        texto.includes("piano") ||
        texto.includes("bateria") ||
        texto.includes("bajo") ||
        texto.includes("escala") ||
        texto.includes("ritmo") ||
        texto.includes("tonalidad") ||
        texto.includes("adoracion") ||
        texto.includes("alabanza") ||
        texto.includes("worship")
    ) {
        return {
            modulo: "Música",
            intencion: "musica",
            confianza: 0.95
        };
    }

    // =====================================
    // PODCAST
    // =====================================

    if (
        texto.includes("podcast") ||
        texto.includes("episodio") ||
        texto.includes("guion") ||
        texto.includes("entrevista") ||
        texto.includes("invitado") ||
        texto.includes("grabacion")
    ) {
        return {
            modulo: "Podcast",
            intencion: "podcast",
            confianza: 0.95
        };
    }

    // =====================================
    // ASISTENTE
    // =====================================

    return {
        modulo: "Asistente",
        intencion: "asistente",
        confianza: 0.70
    };
}

function generarRespuesta(mensaje, analisis) {

    const texto = limpiarTexto(mensaje);
    const modulo = analisis.modulo;
    const intencion = analisis.intencion;

    // =====================================
    // CONTEXTO BÍBLICO
    // =====================================

    if (modulo === "Biblia") {

        // Crear proyecto de prédica
        if (
            texto.includes("predica") ||
            texto.includes("predicar") ||
            texto.includes("sermon")
        ) {
            CHINO.contexto.proyecto = "predica";
        }

        // Detectar tema
        if (texto.startsWith("sobre ")) {
            CHINO.contexto.tema = mensaje
                .substring(6)
                .trim();
        }

        // Detectar audiencia
        if (
            texto.includes("para jovenes") ||
            texto.includes("para joven")
        ) {
            CHINO.contexto.audiencia = "jóvenes";
        }

        // =====================================
        // GENERAR 3 PUNTOS
        // =====================================

        if (
            texto.includes("dame 3 puntos") ||
            texto.includes("3 puntos") ||
            texto.includes("tres puntos")
        ) {

            const tema = CHINO.contexto.tema || "el tema indicado";
            const audiencia = CHINO.contexto.audiencia || "general";

            if (tema.toLowerCase().includes("david")) {

                CHINO.contexto.detalles = [
                    "David aprendió a confiar en Dios antes de enfrentar a Goliat.",
                    "David no permitió que las opiniones de otros definieran su identidad.",
                    "David aprendió a esperar el tiempo de Dios para cumplir su propósito."
                ];

                return `
📖 PRÉDICA: DAVID

👥 Audiencia: ${audiencia}

🔥 3 PUNTOS

1. David aprendió a confiar en Dios antes de enfrentar a Goliat.

2. David no permitió que las opiniones de otros definieran su identidad.

3. David aprendió a esperar el tiempo de Dios para cumplir su propósito.

🧠 Contexto conservado:
Tema: ${tema}
Audiencia: ${audiencia}
                `;
            }

            return `
📖 PRÉDICA: ${tema}

👥 Audiencia: ${audiencia}

🔥 3 PUNTOS

Puedo preparar los puntos tomando en cuenta el tema y la audiencia.
            `;
        }

        // =====================================
        // DESARROLLAR UN PUNTO
        // =====================================

        if (
            texto.includes("desarrolla el punto") ||
            texto.includes("desarrollar el punto") ||
            texto.includes("explica el punto")
        ) {

            let numeroPunto = null;

            if (
                texto.includes("punto 1") ||
                texto.includes("punto uno")
            ) {
                numeroPunto = 1;
            }

            if (
                texto.includes("punto 2") ||
                texto.includes("punto dos")
            ) {
                numeroPunto = 2;
            }

            if (
                texto.includes("punto 3") ||
                texto.includes("punto tres")
            ) {
                numeroPunto = 3;
            }

            if (
                numeroPunto &&
                CHINO.contexto.detalles &&
                CHINO.contexto.detalles.length >= numeroPunto
            ) {

                const punto =
                    CHINO.contexto.detalles[numeroPunto - 1];

                return `
📖 DESARROLLO DEL PUNTO ${numeroPunto}

🎯 Tema: ${CHINO.contexto.tema}

👥 Audiencia: ${CHINO.contexto.audiencia}

🔥 Punto:

${punto}

🧠 CHINO reconoce que estás desarrollando este punto de tu prédica.
                `;
            }

            return `
🧠 No encontré el punto que quieres desarrollar.

Primero genera los 3 puntos de la prédica.
            `;
        }

        // =====================================
        // RESPUESTA NORMAL DE BIBLIA
        // =====================================

        return `
📖 Módulo Biblia activado.

🧠 Contexto actual:

Proyecto: ${CHINO.contexto.proyecto || "ninguno"}

Tema: ${CHINO.contexto.tema || "ninguno"}

Audiencia: ${CHINO.contexto.audiencia || "general"}

Puedes seguir agregando instrucciones y conservaré este contexto.
        `;
    }

    // =====================================
    // MÚSICA
    // =====================================

    if (modulo === "Música") {
        return `
🎸 Módulo Música activado.

🧠 El administrador de contexto está activo.

Puedo trabajar con canciones, acordes, escalas, instrumentos y adoración.
        `;
    }

    // =====================================
    // PODCAST
    // =====================================

    if (modulo === "Podcast") {
        return `
🎙️ Módulo Podcast activado.

🧠 El administrador de contexto está activo.

Puedo trabajar con guiones, preguntas, episodios e ideas para contenido.
        `;
    }

    // =====================================
    // ASISTENTE
    // =====================================

    return `
🤖 Soy CHINO AI ${CHINO.version}.

🧠 Cerebro central: activo
💾 Memoria: activa
🎯 Contexto: activo
🔄 Enrutamiento: activo

Estoy listo para trabajar contigo.
    `;
}
    // =========================
    // MÚSICA
    // =========================
    if (modulo === "Música") {
        return `
🎸 Módulo Música activado.

🧠 El administrador de contexto está activo.
Puedo trabajar con canciones, acordes, escalas, instrumentos y adoración.
        `;
    }

    // =========================
    // PODCAST
    // =========================
    if (modulo === "Podcast") {
        return `
🎙️ Módulo Podcast activado.

🧠 El administrador de contexto está activo.
Puedo trabajar con guiones, preguntas, episodios e ideas para contenido.
        `;
    }

    // =========================
    // ASISTENTE
    // =========================
    return `
🤖 Soy CHINO AI ${CHINO.version}.

🧠 Cerebro central: activo
💾 Memoria: activa
🎯 Contexto: activo
🔄 Enrutamiento: activo

Estoy listo para trabajar contigo.
    `;
}
function mostrarMensajeUsuario(

    mensaje

) {

    const chat =
        document.getElementById(
            "chat"
        );


    const mensajeSeguro =
        escaparHTML(mensaje);


    chat.innerHTML += `

        <div class="message user">

            👤 <strong>Tú:</strong>

            ${mensajeSeguro}

        </div>

    `;


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   MOSTRAR RESPUESTA
   ===================================================== */

function mostrarRespuesta(

    respuesta

) {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML += `

        <div class="message jarvis">

            🤖 <strong>CHINO:</strong>

            ${respuesta}

        </div>

    `;


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   FUNCIÓN PRINCIPAL
   ===================================================== */

function enviarMensaje() {

    const input =
        document.getElementById(
            "userInput"
        );


    const mensaje =
        input.value.trim();


    if (

        mensaje === ""

    ) {

        return;

    }


    /* =========================
       GUARDAR MENSAJE
       ========================= */

    guardarMemoria(

        "usuario",

        mensaje

    );


    /* =========================
       MOSTRAR MENSAJE
       ========================= */

    mostrarMensajeUsuario(

        mensaje

    );


    /* =========================
       LIMPIAR INPUT
       ========================= */

    input.value = "";


    /* =========================
       PROCESAMIENTO
       ========================= */

    setTimeout(() => {


        /* Analizar */

        const analisis =
            analizarIntencion(
                mensaje
            );

CHINO.moduloActual = analisis.modulo;
        console.log(

            "🧠 Análisis:",
            analisis

        );


        /* Generar */

        const respuesta =
            generarRespuesta(

                mensaje,

                analisis

            );


        /* Guardar respuesta */

        guardarMemoria(

            "chino",

            respuesta

        );


        /* Mostrar */

        mostrarRespuesta(

            respuesta

        );


    }, 500);

}


/* =====================================================
   ACTIVACIÓN MANUAL DE MÓDULOS
   ===================================================== */

function modulo(nombre) {

    CHINO.moduloActual =
        nombre;


    let respuesta = "";


    if (

        nombre === "Biblia"

    ) {

        respuesta = `

        📖 <strong>Módulo Biblia activado.</strong>

        <br><br>

        Estoy listo para trabajar
        contigo en temas bíblicos.

        `;

    }


    if (

        nombre === "Música"

    ) {

        respuesta = `

        🎵 <strong>Módulo Música activado.</strong>

        <br><br>

        Estoy listo para ayudarte
        con música, acordes y adoración.

        `;

    }


    if (

        nombre === "Podcast"

    ) {

        respuesta = `

        🎙️ <strong>Módulo Podcast activado.</strong>

        <br><br>

        Estoy listo para ayudarte
        con contenido y producción
        de podcast.

        `;

    }


    if (

        nombre === "Asistente"

    ) {

        respuesta = `

        🧠 <strong>Cerebro central activado.</strong>

        <br><br>

        Memoria de conversación:
        <strong>ACTIVA</strong>

        `;

    }


    mostrarRespuesta(

        respuesta

    );


    guardarMemoria(

        "chino",

        respuesta

    );

}


/* =====================================================
   INICIALIZACIÓN
   ===================================================== */

console.log(
    "================================="
);

console.log(
    "CHINO AI 3.0"
);

console.log(
    "Cerebro central: ACTIVO"
);

console.log(
    "Memoria V1: ACTIVA"
);

console.log(
    "================================="
);

</script>   
  
</body>
</html>
