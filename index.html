<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHINO AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050b14;
      color: white;
      text-align: center;
    }

    header {
      padding: 30px 20px 15px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      color: #00d9ff;
      text-shadow: 0 0 20px #00d9ff;
    }

    .subtitle {
      color: #8ea5b8;
      margin-top: 8px;
    }

    .chat {
      width: 90%;
      max-width: 700px;
      height: 400px;
      margin: 25px auto;
      background: #0b1420;
      border: 1px solid #17354d;
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
      text-align: left;
    }

    .message {
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    .CHINO {
      background: #102638;
      border-left: 3px solid #00d9ff;
    }

    .user {
      background: #17351f;
      margin-left: auto;
      border-right: 3px solid #00ff88;
    }

    .input-area {
      width: 90%;
      max-width: 700px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #24445c;
      background: #0b1420;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #00bcd4;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00e5ff;
    }

    .modules {
      margin: 30px auto;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .module {
      background: #101d2b;
      border: 1px solid #1d4058;
    }
  </style>
</head>

<body>

  <header>
    <h1>CHINO AI</h1>
    <p class="subtitle">Asistente central de IA personal</p>
  </header>

  <div class="chat" id="chat">
    <div class="message jarvis">
      🤖 <strong>CHINO:</strong> Sistema iniciado. ¿En qué puedo ayudarte?
    </div>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Escribe un mensaje..."
      onkeydown="if(event.key === 'Enter') enviarMensaje()"
    >

    <button onclick="enviarMensaje()">Enviar</button>
  </div>

  <div class="modules">
    <button class="module" onclick="modulo('Biblia')">📖 Biblia</button>
    <button class="module" onclick="modulo('Música')">🎵 Música</button>
    <button class="module" onclick="modulo('Podcast')">🎙️ Podcast</button>
    <button class="module" onclick="modulo('Asistente')">🧠 Asistente</button>
  </div>

   <script>

/* =====================================================
   CHINO AI 3.0
   CEREBRO CENTRAL + MEMORIA V1
   ===================================================== */


/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const CHINO = {

    nombre: "CHINO",

    version: "3.0",

    personalidad: "cercana",

    moduloActual: "Asistente",

    estado: "activo"

};


/* =====================================================
   MEMORIA DE CONVERSACIÓN
   ===================================================== */

let memoriaConversacion = [];


/*
   Guarda un mensaje en la memoria
*/

function guardarMemoria(rol, mensaje) {

    memoriaConversacion.push({

        rol: rol,

        mensaje: mensaje,

        fecha: new Date().toISOString()

    });


    /*
       Evitamos que la memoria crezca
       indefinidamente.
    */

    if (memoriaConversacion.length > 30) {

        memoriaConversacion.shift();

    }


    console.log(
        "🧠 Memoria actual:",
        memoriaConversacion
    );

}


/*
   Obtiene los últimos mensajes
*/

function obtenerMemoria() {

    return memoriaConversacion
        .slice(-10);

}


/*
   Limpia la memoria
*/

function limpiarMemoria() {

    memoriaConversacion = [];

    console.log(
        "🧠 Memoria de CHINO limpiada."
    );

}


/* =====================================================
   UTILIDADES
   ===================================================== */

function limpiarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


function escaparHTML(texto) {

    const div = document.createElement("div");

    div.textContent = texto;

    return div.innerHTML;

}


/* =====================================================
   CEREBRO CENTRAL
   ===================================================== */

function analizarIntencion(mensaje) {

    const texto = limpiarTexto(mensaje);

    /* =========================
       CONTINUACIÓN DE CONTEXTO
       ========================= */

    const frasesContinuacion = [
        "sobre ",
        "que sea ",
        "para jovenes",
        "para jovenes",
        "que dure ",
        "dame ",
        "hazlo ",
        "quiero que ",
        "tambien ",
        "ademas ",
        "agrega ",
        "ponle ",
        "con ",
        "y que ",
        "ahora "
    ];

    if (
        CHINO.moduloActual !== "Asistente" &&
        frasesContinuacion.some(frase =>
            texto.startsWith(frase)
        )
    ) {

        return {

            modulo: CHINO.moduloActual,

            intencion: "continuacion",

            confianza: 0.95

        };

    }


    /* =========================
       BIBLIA
       ========================= */

    const palabrasBiblia = [

        "biblia",
        "versiculo",
        "versiculos",
        "pasaje",
        "pasajes",
        "predica",
        "predicar",
        "predicacion",
        "sermon",
        "sermones",
        "estudio biblico",
        "capitulo",
        "evangelio",
        "jesus",
        "dios",
        "apostol",
        "apostoles",
        "oracion",
        "orar",
        "devocional",
        "texto biblico",
        "ensenanza biblica"

    ];

    if (
        palabrasBiblia.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {

            modulo: "Biblia",

            intencion: "biblia",

            confianza: 0.95

        };

    }


    /* =========================
       MÚSICA
       ========================= */

    const palabrasMusica = [

        "musica",
        "cancion",
        "canciones",
        "acorde",
        "acordes",
        "guitarra",
        "teclado",
        "piano",
        "bateria",
        "bajo",
        "escala",
        "escalas",
        "ritmo",
        "tonalidad",
        "adoracion",
        "alabanza",
        "worship",
        "musico",
        "musicos"

    ];

    if (
        palabrasMusica.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {

            modulo: "Música",

            intencion: "musica",

            confianza: 0.95

        };

    }


    /* =========================
       PODCAST
       ========================= */

    const palabrasPodcast = [

        "podcast",
        "episodio",
        "episodios",
        "guion",
        "guiones",
        "entrevista",
        "entrevistas",
        "invitado",
        "invitados",
        "grabacion"

    ];

    if (
        palabrasPodcast.some(palabra =>
            texto.includes(palabra)
        )
    ) {

        return {

            modulo: "Podcast",

            intencion: "podcast",

            confianza: 0.95

        };

    }


    /* =========================
       ASISTENTE
       ========================= */

    return {

        modulo: "Asistente",

        intencion: "general",

        confianza: 0.30

    };

}

function generarRespuesta(

    mensaje,

    analisis

) {

    const modulo =
        analisis.modulo;


    const intencion =
        analisis.intencion;


    /* =========================
       SALUDO
       ========================= */

    if (

        intencion === "saludo"

    ) {

        return `

        Hola bro. 😎

        Soy CHINO AI 3.0.

        🧠 Cerebro central activo.
        💾 Memoria de conversación activa.

        ¿Qué vamos a construir hoy?

        `;

    }


    /* =========================
       BIBLIA
       ========================= */

    if (

        modulo === "Biblia"

    ) {

        CHINO.moduloActual =
            "Biblia";


        return `

        📖 <strong>Módulo Biblia activado.</strong>

        <br><br>

        Entendí que tu solicitud está
        relacionada con la Biblia.

        <br><br>

        La memoria de CHINO está
        conservando nuestra conversación
        para mantener el contexto.

        `;

    }


    /* =========================
       MÚSICA
       ========================= */

    if (

        modulo === "Música"

    ) {

        CHINO.moduloActual =
            "Música";


        return `

        🎵 <strong>Módulo Música activado.</strong>

        <br><br>

        Entendí que estás trabajando
        con música.

        <br><br>

        CHINO conservará el contexto
        de nuestra conversación.

        `;

    }


    /* =========================
       PODCAST
       ========================= */

    if (

        modulo === "Podcast"

    ) {

        CHINO.moduloActual =
            "Podcast";


        return `

        🎙️ <strong>Módulo Podcast activado.</strong>

        <br><br>

        Entendí que estás trabajando
        en contenido para podcast.

        <br><br>

        La conversación queda guardada
        en la memoria temporal de CHINO.

        `;

    }


    /* =========================
       CONTINUACIÓN
       ========================= */

    if (

        intencion === "continuacion"

    ) {

        return `

        🧠 <strong>CHINO recuerda el contexto.</strong>

        <br><br>

        Seguimos trabajando en el módulo:

        <strong>${CHINO.moduloActual}</strong>

        <br><br>

        Tu nuevo mensaje fue:

        "${escaparHTML(mensaje)}"

        `;

    }


    /* =========================
       ASISTENTE
       ========================= */

    if (

        modulo === "Asistente"

    ) {

        CHINO.moduloActual =
            "Asistente";


        return `

        🤖 <strong>Asistente central activado.</strong>

        <br><br>

        Soy CHINO AI 3.0.

        <br><br>

        🧠 Cerebro central: ACTIVO

        <br>

        💾 Memoria: ACTIVA

        <br>

        📖 Biblia: CONECTADA

        <br>

        🎵 Música: CONECTADA

        <br>

        🎙️ Podcast: CONECTADO

        `;

    }


    return "Sistema central activo.";

}


/* =====================================================
   MOSTRAR MENSAJE DEL USUARIO
   ===================================================== */

function mostrarMensajeUsuario(

    mensaje

) {

    const chat =
        document.getElementById(
            "chat"
        );


    const mensajeSeguro =
        escaparHTML(mensaje);


    chat.innerHTML += `

        <div class="message user">

            👤 <strong>Tú:</strong>

            ${mensajeSeguro}

        </div>

    `;


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   MOSTRAR RESPUESTA
   ===================================================== */

function mostrarRespuesta(

    respuesta

) {

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML += `

        <div class="message jarvis">

            🤖 <strong>CHINO:</strong>

            ${respuesta}

        </div>

    `;


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   FUNCIÓN PRINCIPAL
   ===================================================== */

function enviarMensaje() {

    const input =
        document.getElementById(
            "userInput"
        );


    const mensaje =
        input.value.trim();


    if (

        mensaje === ""

    ) {

        return;

    }


    /* =========================
       GUARDAR MENSAJE
       ========================= */

    guardarMemoria(

        "usuario",

        mensaje

    );


    /* =========================
       MOSTRAR MENSAJE
       ========================= */

    mostrarMensajeUsuario(

        mensaje

    );


    /* =========================
       LIMPIAR INPUT
       ========================= */

    input.value = "";


    /* =========================
       PROCESAMIENTO
       ========================= */

    setTimeout(() => {


        /* Analizar */

        const analisis =
            analizarIntencion(
                mensaje
            );


        console.log(

            "🧠 Análisis:",
            analisis

        );


        /* Generar */

        const respuesta =
            generarRespuesta(

                mensaje,

                analisis

            );


        /* Guardar respuesta */

        guardarMemoria(

            "chino",

            respuesta

        );


        /* Mostrar */

        mostrarRespuesta(

            respuesta

        );


    }, 500);

}


/* =====================================================
   ACTIVACIÓN MANUAL DE MÓDULOS
   ===================================================== */

function modulo(nombre) {

    CHINO.moduloActual =
        nombre;


    let respuesta = "";


    if (

        nombre === "Biblia"

    ) {

        respuesta = `

        📖 <strong>Módulo Biblia activado.</strong>

        <br><br>

        Estoy listo para trabajar
        contigo en temas bíblicos.

        `;

    }


    if (

        nombre === "Música"

    ) {

        respuesta = `

        🎵 <strong>Módulo Música activado.</strong>

        <br><br>

        Estoy listo para ayudarte
        con música, acordes y adoración.

        `;

    }


    if (

        nombre === "Podcast"

    ) {

        respuesta = `

        🎙️ <strong>Módulo Podcast activado.</strong>

        <br><br>

        Estoy listo para ayudarte
        con contenido y producción
        de podcast.

        `;

    }


    if (

        nombre === "Asistente"

    ) {

        respuesta = `

        🧠 <strong>Cerebro central activado.</strong>

        <br><br>

        Memoria de conversación:
        <strong>ACTIVA</strong>

        `;

    }


    mostrarRespuesta(

        respuesta

    );


    guardarMemoria(

        "chino",

        respuesta

    );

}


/* =====================================================
   INICIALIZACIÓN
   ===================================================== */

console.log(
    "================================="
);

console.log(
    "CHINO AI 3.0"
);

console.log(
    "Cerebro central: ACTIVO"
);

console.log(
    "Memoria V1: ACTIVA"
);

console.log(
    "================================="
);

</script>   
  
</body>
</html>
